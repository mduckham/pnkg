function pickNameField(fields) {
  const c = ["name","NAME","name_en","label","Name","name:en"];
  return c.find(f => fields && Object.prototype.hasOwnProperty.call(fields, f)) || null;
}
function shortPred(uri) {
  try { const u=new URL(uri); return u.hash?u.hash.substring(1):u.pathname.split("/").pop(); }
  catch { return uri.split(/[\/#]/).pop()||uri; }
}
function preferLabelFromURI(uri) {
  try { const u=new URL(uri); return decodeURIComponent(u.pathname.split("/").pop() || u.href); }
  catch { return uri.split(/[\/#]/).pop() || uri; }
}
function cssEscape(s) { return String(s).replace(/(["\\])/g, "\\$1"); }
function approximateCenter(feature) {
  try {
    const g = feature.geometry;
    if (!g) return null;
    if (g.type === "Point") return g.coordinates.slice(0,2);
    const bounds = new maplibregl.LngLatBounds();
    (function walk(coords){
      if (typeof coords[0] === "number") bounds.extend(coords);
      else coords.forEach(walk);
    })(g.coordinates);
    return bounds.getCenter().toArray();
  } catch { return null; }
}

/* ===================== SPARQL ===================== */
async function runSparql(query) {
  const res = await fetch(FUSEKI_URL, {
    method: "POST",
    headers: { "Accept": "application/sparql-results+json", "Content-Type": "application/x-www-form-urlencoded" },
    body: `query=${encodeURIComponent(query)}`
  });
  if (!res.ok) throw new Error(`Fuseki ${res.status}`);
  return res.json();
}

function toTitleCase(str) {
  return str
    .toLowerCase()
    .split(' ')
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(' ');
}


async function loadGraphFor(geomIri) {
  const q = `
PREFIX pn:  <http://linked.data.gov.au/def/placenames/>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
prefix dcterms: <http://purl.org/dc/terms/>
prefix loci: <http://linked.data.gov.au/def/loci#>
prefix dcat: <http://www.w3.org/ns/dcat#>

SELECT ?place ?name ?category ?plnm ?dateGazetted ?loc ?geom ?metaData ?location ?publisher ?status
(REPLACE(STRAFTER(STR(?status), "http://geosensor.net/ns/pnkg/"), "%20", " ") AS ?statusLabel)
  WHERE {
  ?loc   geo:asWKT ?geom .
  ?place geo:hasGeometry ?loc .
  ?place pn:hasPlaceClassification ?category .
  ?place pn:hasPlaceName ?plnm .
  ?plnm  pn:name ?name .
  ?plnm loci:isMemberOf ?metaData .
  OPTIONAL { ?plnm pn:status ?status .}
  OPTIONAL { ?plnm pn:dateGazetted ?dateGazetted . }
  OPTIONAL { ?metaData dcterms:Location ?location .}
  OPTIONAL { ?metaData dcterms:publisher ?publisher .}

  FILTER(?loc = <${geomIri}>)
}`;

  let rows = [];
  try {
    rows = (await runSparql(q)).results?.bindings ?? [];
  } catch (err) {
    graphInfo.innerHTML = `SPARQL error: ${err.message}`;
    return;
  }

  cy.elements().remove();
  if (!rows.length) {
    cy.add({ data:{ id: geomIri, uri: geomIri, label: preferLabelFromURI(geomIri), type:"geometry", selectedNode:true } });
    cy.layout({ name:"cose", animate:true }).run();
    return;
  }

  const seen = new Set();
  const r0 = rows[0];
  const place = r0.place.value;
  const placeName = r0.plnm.value;

  //Base Place node
  cy.add({ data:{ id: place, uri: place, label: "Place : "+ preferLabelFromURI(place), type:"place", selectedNode:false } });
  seen.add(place);

  for (const r of rows) {
    //  Geometry instance
    if (r.loc) {
      const loc = r.loc.value;
      if (!seen.has(loc)) {
        cy.add({ data:{ id: loc, uri: loc, label: "Geometry : "+ preferLabelFromURI(loc), type:"geometry" } });
        seen.add(loc);
      }
      cy.add({ data:{ id: place + "-geom-" + loc, source: place, target: loc, label: "geo:hasGeometry" } });

      // Geometry literal (asWKT)
      if (r.geom) {
        const litGeom = loc + "::wkt";
        if (!seen.has(litGeom)) {
          cy.add({ data:{ id: litGeom, label: r.geom.value, literal: true } });
          seen.add(litGeom);
        }
        cy.add({ data:{ id: loc + "-wkt", source: loc, target: litGeom, label: "geo:asWKT" } });
      }
    }

    // Classification
    if (r.category) {
      const cat = r.category.value;
      if (!seen.has(cat)) {
        cy.add({ data:{ id: cat, uri: cat, label: preferLabelFromURI(cat), type:"category" } });
        seen.add(cat);
      }
      cy.add({ data:{ id: place + "-cat-" + cat, source: place, target: cat, label: "pn:hasPlaceClassification" } });
    }

    //  Placename instance
    if (r.plnm) {
      const plnm = r.plnm.value;
      if (!seen.has(plnm)) {
        cy.add({ data:{ id: plnm, uri: plnm, label: "Place Name : " + preferLabelFromURI(plnm), type:"placename" } });
        seen.add(plnm);
      }
      cy.add({ data:{ id: place + "-plnm-" + plnm, source: place, target: plnm, label: "pn:hasPlaceName" } });

      // Placename literals
      if (r.name) {
        const litName = plnm + "::name";
        if (!seen.has(litName)) {
          cy.add({ data:{ id: litName, label: r.name.value, literal: true } });
          seen.add(litName);
        }
        cy.add({ data:{ id: plnm + "-name", source: plnm, target: litName, label: "pn:name" } });
      }

      if (r.dateGazetted && !/^0+$/.test(r.dateGazetted.value)) {
        const litDate = plnm + "::dateGazetted";
        if (!seen.has(litDate)) {
          cy.add({ data:{ id: litDate, label: r.dateGazetted.value, literal: true } });
          seen.add(litDate);
        }
        cy.add({ data:{ id: plnm + "-date", source: plnm, target: litDate, label: "pn:dateGazetted" } });
      }
      
  //    if (r.status) {
  //      const litStatus = plnm + "::status";
  //      if (!seen.has(litStatus)) {
  //        cy.add({ data:{ id: litStatus, label: r.statusLabel.value, literal: true } });
  //        seen.add(litStatus);
  //      }
  //      cy.add({ data:{ id: plnm + "-status", source: plnm, target: litStatus, label: "pn:status" } });
   //   }
    

    }

    //  MetaData instance
    if (r.metaData) {
      const metaData = r.metaData.value;
      if (!seen.has(metaData)) {
        cy.add({ data:{ id: metaData, uri: metaData, label: preferLabelFromURI(metaData), type:"metaData" } });
        seen.add(metaData);
      }
      cy.add({ data:{ id: placeName + "-metaData-" + metaData, source: placeName, target: metaData, label: "loci:isMemberOf" } });

      // MetaData literals
      if (r.publisher) {
        const litPublisher = metaData + "::publisher";
        if (!seen.has(litPublisher)) {
          cy.add({ data:{ id: litPublisher, label: r.publisher.value, literal: true } });
          seen.add(litPublisher);
        }
        cy.add({ data:{ id: metaData + "-publisher", source: metaData, target: litPublisher, label: "dcterms:publisher" } });
      }

       if (r.location) {
        const litLocation = metaData + "::location";
        if (!seen.has(litLocation)) {
          cy.add({ data:{ id: litLocation, label: r.location.value, literal: true } });
          seen.add(litLocation);
        }
        cy.add({ data:{ id: metaData + "-location", source: metaData, target: litLocation, label: "dcterms:Location" } });
      }

    }

  }

  cy.layout({ name:"cose", animate:true }).run();

  // Graph → Map
  cy.off("tap");
  cy.on("tap", "node", async (evt) => {
    const n = evt.target;
    const uri = n.data("uri");
    if (!uri) {
      graphInfo.innerHTML = `<strong>Literal:</strong> ${n.data("label")}`;
      return;
    }
    graphInfo.innerHTML = `<strong>Node:</strong> ${uri}`;
    await focusMapOn(uri);
  });
}


/* ===================== Map (MapLibre + PMTiles) ===================== */
const map = new maplibregl.Map({
  container: "map",
  style: `https://api.maptiler.com/maps/streets/style.json?key=${MAPTILER_KEY}`,
  center: [144.9631, -37.8136], // Melbourne
  zoom: 6
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.on("error", e => console.error("Map error:", e?.error || e));

let VECTOR_LAYER_IDS = [];

/* Load PMTiles and add geometry layers + selection layers + events */
map.on("load", async () => {
  const p = new pmtiles.PMTiles(PMTILES_HTTP);
  const meta = await p.getMetadata().catch(() => null);

  if (meta && Array.isArray(meta.vector_layers) && meta.vector_layers.length) {
    map.addSource("tiles", { type: "vector", url: PMTILES_URL });
    VECTOR_LAYER_IDS = meta.vector_layers.map(vl => vl.id);

    meta.vector_layers.forEach((vl, i) => {
      const LAYER = vl.id;
      const NAME  = pickNameField(vl.fields);

      /* ---- Polygons & MultiPolygons ---- */
      /**paint:{ "fill-color":"#bdbdbd", "fill-opacity":0.05, "fill-outline-color":"#6a1b9a"  }**/
      map.addLayer({
        id:`poly-fill-${i}`, type:"fill", source:"tiles", "source-layer":LAYER,
        filter:["==",["geometry-type"],"Polygon"],
       paint:{ "fill-color":"#bdbdbd", "fill-opacity":0.00, "fill-outline-color":"#808080"  }        

      });
      map.addLayer({
        id:`poly-outline-${i}`, type:"line", source:"tiles", "source-layer":LAYER,
        filter:["==",["geometry-type"],"Polygon"],
        paint:{ "line-color":"#808080", "line-width":0.2 }
      });

      /* ---- Lines & MultiLineStrings ---- */
      map.addLayer({
        id:`line-${i}`, type:"line", source:"tiles", "source-layer":LAYER,
        filter:["==",["geometry-type"],"LineString"],
        paint:{
          "line-color":"#808080",
          "line-width":["interpolate",["linear"],["zoom"], 5, 1, 12, 2.5, 16, 4]
        }
      });

      /* ---- Points & MultiPoints ---- */
      map.addLayer({
        id:`pt-${i}`, type:"circle", source:"tiles", "source-layer":LAYER,
        filter:["==",["geometry-type"],"Point"],
        paint:{
          "circle-radius":["interpolate",["linear"],["zoom"], 3,2, 8,3, 12,4, 16,5],
          "circle-color":"#e53935",
          "circle-stroke-color":"#ffffff",
          "circle-stroke-width":1
        }
      });

      /* ---- Optional labels for points ---- */
      if (NAME) {
        map.addLayer({
          id:`pt-label-${i}`, type:"symbol", source:"tiles", "source-layer":LAYER,
          filter:["==",["geometry-type"],"Point"],
          layout:{ "text-field":["get",NAME], "text-size":12, "text-offset":[0, 1.1] },
          paint:{ "text-halo-width":1, "text-halo-color":"#fff" }
        });
      }

      /* ---- Selection highlight layers ---- */
      map.addLayer({
        id:`poly-selected-${i}`, type:"line", source:"tiles", "source-layer":LAYER,
        filter:["all", ["==",["geometry-type"],"Polygon"], ["==",["get","id"], ""]],
        paint:{ "line-color":"#ff1744", "line-width":2 }
      });
      map.addLayer({
        id:`line-selected-${i}`, type:"line", source:"tiles", "source-layer":LAYER,
        filter:["all", ["==",["geometry-type"],"LineString"], ["==",["get","id"], ""]],
        paint:{ "line-color":"#ff1744", "line-width":2 }
      });
      map.addLayer({
        id:`pt-selected-${i}`, type:"circle", source:"tiles", "source-layer":LAYER,
        filter:["all", ["==",["geometry-type"],"Point"], ["==",["get","id"], ""]],
        paint:{
          "circle-radius":["interpolate",["linear"],["zoom"], 3,3, 8,5, 12,6, 16,7],
          "circle-color":"#ff8a80",
          "circle-stroke-color":"#ff1744",
          "circle-stroke-width":2
        }
      });

     

function clearAllSelections(i) {
  map.setFilter(`pt-selected-${i}`, ["all", ["==", ["geometry-type"], "Point"], ["==", ["get", "id"], ""]]);
  map.setFilter(`line-selected-${i}`, ["all", ["==", ["geometry-type"], "LineString"], ["==", ["get", "id"], ""]]);
  map.setFilter(`poly-selected-${i}`, ["all", ["==", ["geometry-type"], "Polygon"], ["==", ["get", "id"], ""]]);
}

function setSelection(geomType, id) {
  const empty = ["==", ["get", "id"], ""];
  clearAllSelections(i); // always reset others first

  if (geomType === "Polygon") {
    map.setFilter(`poly-selected-${i}`, id
      ? ["all", ["==", ["geometry-type"], "Polygon"], ["==", ["get", "id"], id]]
      : ["all", ["==", ["geometry-type"], "Polygon"], empty]
    );
  } else if (geomType === "LineString") {
    map.setFilter(`line-selected-${i}`, id
      ? ["all", ["==", ["geometry-type"], "LineString"], ["==", ["get", "id"], id]]
      : ["all", ["==", ["geometry-type"], "LineString"], empty]
    );
  } else if (geomType === "Point") {
    map.setFilter(`pt-selected-${i}`, id
      ? ["all", ["==", ["geometry-type"], "Point"], ["==", ["get", "id"], id]]
      : ["all", ["==", ["geometry-type"], "Point"], empty]
    );
  }
}
      /* ---- Shared click handler (per geometry type) ---- */
      async function handleFeatureClick(e, geomType) {
        const f = e.features?.[0]; if (!f) return;
        const id = f.properties?.id;   // IMPORTANT: your features must carry a unique 'id' IRI property
        setSelection(geomType, id || "");
        const html = await queryFusekiHTML(id);
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
        await loadGraphFor(id);
      }

      // Click events

map.on("click", (e) => {
  // First: check for points
  const pointFeatures = map.queryRenderedFeatures(e.point, { layers: [`pt-${i}`] });
  if (pointFeatures.length) {
    handleFeatureClick({ features: pointFeatures, lngLat: e.lngLat }, "Point");
    return; // stop here
  }

  // Then: check for lines
  const lineFeatures = map.queryRenderedFeatures(e.point, { layers: [`line-${i}`] });
  if (lineFeatures.length) {
    handleFeatureClick({ features: lineFeatures, lngLat: e.lngLat }, "LineString");
    return;
  }

  // Finally: polygons
  const polyFeatures = map.queryRenderedFeatures(e.point, { layers: [`poly-fill-${i}`] });
  if (polyFeatures.length) {
    handleFeatureClick({ features: polyFeatures, lngLat: e.lngLat }, "Polygon");
  }
});

      // Pointer cursor on hover
      ["pt-"+i, "line-"+i, "poly-fill-"+i].forEach(layer => {
        map.on("mouseenter", layer, () => map.getCanvas().style.cursor = "pointer");
        map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
      });
    });

    // Fit to PMTiles bounds if available
    if (meta?.bounds?.length === 4) {
      const [w, s, e, n] = meta.bounds;
      map.fitBounds([[w, s], [e, n]], { padding: 20, duration: 0 });
    }
  } else {
    // Raster fallback
    map.addSource("tiles", { type: "raster", url: PMTILES_URL, tileSize: 256 });
    map.addLayer({ id: "raster", type: "raster", source: "tiles" });
  }
});

/* ================ Graph → Map focus (by feature IRI) ================ */
async function focusMapOn(uri) {
  for (let i = 0; i < VECTOR_LAYER_IDS.length; i++) {
    const sourceLayer = VECTOR_LAYER_IDS[i];
    const feats = map.querySourceFeatures("tiles", {
      sourceLayer,
      filter: ["==", ["get", "id"], uri]
    });
    if (feats && feats.length) {
      const f = feats[0];
      const center = approximateCenter(f);
      if (center) map.flyTo({ center, zoom: Math.max(map.getZoom(), 12) });

      const gt = f.geometry?.type || "Point";
      if (gt.includes("Polygon")) {
        map.setFilter(`poly-selected-${i}`, ["all", ["==", ["geometry-type"], "Polygon"], ["==", ["get", "id"], uri]]);
      } else if (gt.includes("LineString")) {
        map.setFilter(`line-selected-${i}`, ["all", ["==", ["geometry-type"], "LineString"], ["==", ["get", "id"], uri]]);
      } else {
        map.setFilter(`pt-selected-${i}`, ["all", ["==", ["geometry-type"], "Point"], ["==", ["get", "id"], uri]]);
      }
      return true;
    }
  }
  return false;
}
